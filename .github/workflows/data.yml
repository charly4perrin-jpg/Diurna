# Récupère chaque matin les données chiffrées publiques (pétrole, taux de change, inflation,
# catastrophes) et les met en cache dans data/. Aucune clé API. Lancement manuel possible
# depuis l'onglet Actions (« Run workflow »).
name: Données chiffrées

on:
  schedule:
    - cron: '23 4 * * *'   # vers 5 h 23 à Paris en hiver, avant l'édition de 6 h 47
  workflow_dispatch:
  push:                    # relance automatique quand le script de récupération change
    branches: [main]
    paths:
      - 'tools/fetch-data.mjs'
      - '.github/workflows/data.yml'

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Récupérer les données
        run: node tools/fetch-data.mjs
      - name: Enregistrer si quelque chose a changé
        run: |
          git config user.name "diurna-data"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/markets.json data/indicators.json data/hazards.json
          if git diff --cached --quiet; then echo "Rien de nouveau."; exit 0; fi
          git commit -m "Données du $(date -u +%F)"
          git pull --rebase origin main
          git push origin main
